<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Admission Hub</title>
    
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
        <link rel="stylesheet" href="gatheringpages.css" />

        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    </head>
    <body>
        <ul style="float: right;">
            <a class="active" style="margin: 10px; font-family: Montserrat;" href="manage.html">Back</a>
        </ul>
    
        <h1 class="page-title">Gathering Admission</h1>

        <div id="past-gatherings-view" class="view">
            <h2 class="sub-title">Past Gatherings</h2>
            <button id="new-gathering-btn" class="tracker-button">New Gathering</button>
            <div class="table-container">
                <table id="past-gatherings-table">
                    <thead>
                        <tr><th>Gathering</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <div id="attendance-input-view" class="view" style="display:none;">
            <h2 class="sub-title" id="current-gathering-title">New Gathering</h2>
            <div class="attendance-tracker-container">
                <div id="button-tree-container">
                    <button class="tracker-button" data-step="main-choice" data-type="social_member">Social Member</button>
                    <button class="tracker-button" data-step="main-choice" data-type="regular">Regular</button>
                    <button class="tracker-button" data-step="main-choice" data-type="social_guest">Social Guest</button>
                </div>
            </div>
            
            <p id="current-entry-display"></p>

            <div class="table-container">
                <table id="admissionTable">
                    <thead>
                        <tr>
                            <th>Membership Type</th>
                            <th>Name</th>
                            <th>Section</th>
                            <th>Sober?</th>
                            <th>Payment</th>
                        </tr>
                    </thead>
                    <tbody id="current-attendance-tbody"></tbody>
                </table>
            </div>
            
            <div class="summary-container">
                <p>Total Attendees: <span id="attendee-count">0</span></p>
                <p>Total Income: $<span id="total-income">0.00</span></p>
                <button id="publish-btn" class="tracker-button">Publish</button>
            </div>
        </div>

        <script type="module" src="firebase-init.js"></script>
        <script type="module" src="admission-tracker.js"></script>
    </body>
</html>
