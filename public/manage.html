<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sosh Comm Budgeting - Manage</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/tablestyle.css" />
</head>
<body class="manage">

  <div id="loginSection">
    <!-- Google login -->
    <button id="googleLoginBtn" onclick="loginWithGoogle()" style="
      display: center; align-items: center; gap: 8px;
      background: white; color: #555;
      border: 1px solid #ccc; border-radius: 6px;
      padding: 10px 16px; font-family: Montserrat; font-weight: 600;
      cursor: pointer;
    ">
      <img src="https://developers.google.com/identity/images/g-logo.png"
           alt="Google logo"
           style="width:20px; height:20px;">
      Sign in with Google
    </button>
  </div>

  <div id="content" style="display:none">

    <ul style="float: right;">
      <a class="active" style="margin: 10px; font-family: Montserrat;" href="index.html">Back to Display</a>
      <a class="active" style="margin: 10px; font-family: Montserrat;" href="inventory.html">Inventory</a>
      <a class="active" style="margin: 10px; font-family: Montserrat;" href="https://docs.google.com/spreadsheets/d/11Gyg4tMYMHiI0J4cJ1WFYOpOeyM_R6seJiLpqy02wN8/edit?gid=1395868536#gid=1395868536">Social Members & Events</a>
      <a class="active" style="margin: 10px; font-family: Montserrat;" href="https://docs.google.com/spreadsheets/d/1KOVwuLZrashezY_iW17HgW8Gr6oAK8Sq1eia2K6iOCg/edit?gid=0#gid=0">Inventory</a>
    </ul>
  
    <h1 class="page-title" style="margin-right:37%;">THe Soshcomm Budget Tracker Admin</h1>

    <h2 style="margin:6px 0 0; margin-right: 63%;">Current Balance: $<span id="totalAmount">0.00</span></h2>

  <div class="manage-toolbar">
  <select id="events" class="rect-input" title="Event"></select>
  <button class="rect-square" aria-label="Add Event" onclick="addEvent()">＋</button>
  <input id="date" class="rect-input" type="text" placeholder="MM/DD/YYYY" />
  <input id="transactionAmount" class="rect-input" type="number" step="0.01" placeholder="Amount ($)" />

  <select id="categories" class="rect-input">
    <option value="FoodAndBev">Food &amp; Beverage</option>
    <option value="Alcohol">Alcohol</option>
    <option value="Decor">Decor</option>
    <option value="Services">Service</option>
    <option value="Reimbursement">Reimbursement</option>
    <option value="Dues">Social Dues</option>
    <option value="Door">Door Fee</option>
    <option value="Fine">Fine</option>
    <option value="Other">Other</option>
  </select>

  <input id="description" class="rect-input" type="text" placeholder="Description of Purchase" />

  <button class="rect-cta" onclick="addRow()">Add Transaction</button>
</div>

<div class="scroll-container">
  <div id="cards" class="cards"></div>
  <button id="clearDataBtn">Clear All Data</button>
</div>

</div>

  <script type="module" src="./scripts/firebase-init.js"></script>
  <script type="module" src="./scripts/main-manage.js"></script>
</body>
</html>
